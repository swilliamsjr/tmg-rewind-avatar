name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: short SHA + latest)'
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tmg-rewind-avatar

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_CANONICAL_DEMO == 'true' }}
    environment: canonical-demo
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"

      - name: Resolve FQDN
        id: fqdn
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      - name: Smoke test /health (retry 90s)
        run: |
          for i in $(seq 1 18); do
            if curl --fail --silent "https://${{ steps.fqdn.outputs.fqdn }}/health" ; then
              echo "Healthy after $((i*5))s" ; exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy" ; exit 1

      - name: Diag dump
        run: curl --silent "https://${{ steps.fqdn.outputs.fqdn }}/api/diag" | tee diag.json
