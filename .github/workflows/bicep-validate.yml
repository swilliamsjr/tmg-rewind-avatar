name: bicep-validate

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-validate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: bicep build
        run: az bicep build --file infra/main.bicep --outfile /tmp/azuredeploy.generated.json

      - name: Detect drift between main.bicep and committed azuredeploy.json
        run: |
          diff -q /tmp/azuredeploy.generated.json infra/azuredeploy.json || {
            echo "::error::infra/azuredeploy.json is out of sync with infra/main.bicep."
            echo "Run: az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json"
            exit 1
          }

      - name: bicep lint
        run: az bicep lint --file infra/main.bicep

  whatif:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.SANDBOX_RG != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.SANDBOX_RG }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters resourcePrefix=ciwhatif environmentName=ci-whatif location=${{ vars.SANDBOX_LOCATION || 'swedencentral' }}
